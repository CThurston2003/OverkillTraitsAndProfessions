name: ci
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 #
          token: ${{ secrets.UPLIFT_TOKEN }} 

      # Additional steps specified here

      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: gembaadvantage/uplift-action@v2
        with:
          version: v2.21.0
          args: release
        env:
          GITHUB_TOKEN: ${{ secrets.UPLIFT_TOKEN }}